name: Upstream check

# Needs the network, so it runs weekly and on demand, not on every PR.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  upstream-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Compare with the pinned shadcn
        run: pnpm upstream:check

      - name: Flag stale minimumReleaseAgeExclude entries
        run: node scripts/check-release-age.mts
