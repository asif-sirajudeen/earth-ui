name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Each check runs in its own job, in parallel, so a failure names the check that broke.
jobs:
  # PRs only. Fails when shipped package code changes without a changeset; opt out with `pnpm changeset --empty`.
  # The release bot's "Version Packages" PR consumes changesets, so it is exempt.
  changeset:
    if: github.event_name == 'pull_request' && github.head_ref != 'changeset-release/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # the check diffs against the base branch
      - name: Require a changeset for package changes
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-changeset.mts "origin/$BASE_REF"

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Lint
        run: pnpm lint

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check formatting
        run: pnpm format:check

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Build first: the CLI real-data tests read dist/ and skip without it.
      - name: Build
        run: pnpm build
      - name: Test registry rules
        run: pnpm test

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Typecheck
        run: pnpm typecheck

  generated:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      # Fails when src/index.ts is out of date with src/components/.
      - name: Check src/index.ts is current
        run: pnpm index:check

      # Fails when registry.json is out of date with src/, registry/metadata.ts or styles.css.
      - name: Check registry.json is current
        run: pnpm registry:check

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      # Builds the package, the bundled registry (dist/registry) and the earth-ui bin, then runs the bin.
      - name: Build package and smoke the CLI
        run: |
          pnpm build
          scripts/smoke-cli.sh

  # A PR that breaks the docs site fails CI. The site generates its pages from dist/cli.js, so build first.
  site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build package
        run: pnpm build
      - name: Test and build docs site
        run: pnpm --filter site test && pnpm --filter site build

  registry:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Validate and build registry
        run: pnpm registry

      # Every item resolves from a local copy of the registry, in a radix-vega project like the directory health check.
      - name: Dry-run install of every item
        run: pnpm registry:smoke

  registry-install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Build registry
        run: pnpm registry

      # Real install into a fresh project, then typecheck, Tailwind compile, token placement and idempotent re-add.
      - name: Install every item into a fresh project
        run: pnpm registry:smoke --install

  package-install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Build package
        run: pnpm build

      # Packs the tarball and installs it into a fresh project: imports, typecheck, Tailwind compile and the bin.
      - name: Install the packed package into a fresh project
        run: pnpm package:smoke
