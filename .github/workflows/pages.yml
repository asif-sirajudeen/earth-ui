name: Pages

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      # Needs repo Settings > Pages > Source set to "GitHub Actions".
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # The site reads dist/cli.js to generate its component pages.
      - name: Build package, registry and CLI
        run: pnpm build

      # Copy-mode registry, served at /r/*.json.
      - name: Copy registry into the site
        run: |
          mkdir -p site/public
          cp -r dist/registry site/public/r

      - name: Build docs site
        run: pnpm --filter site build

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      # Failed runs for #21 and #26 sat in "syncing_files" until the action's default 10 minute timeout, while the
      # artifact was the same ~6.6 MB as in green runs: a GitHub-side stall, not our output. Fail fast, then retry once.
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 300000

      # If the retry also fails, the job (and the run on main) fails visibly.
      - name: Retry deploy to GitHub Pages
        id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          timeout: 300000
