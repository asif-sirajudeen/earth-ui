name: Set up
description: Set up pnpm and Node.js, then install dependencies. Run actions/checkout first.

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
      with:
        install: false

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        package-manager-cache: false # avoid cache poisoning (the release workflow publishes from this setup)

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
