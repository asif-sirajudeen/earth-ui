# "." keeps the root library a workspace package for Changesets; without it,
# `changeset status` says @asif-sirajudeen/earth-ui "is not in the workspace".
packages:
  - "."
  - "site"

# site/ is the docs site (spec: docs/specs/docs-site.md on the docs branch). Private, so Changesets skips it.
# esbuild (via fumadocs-mdx) ships prebuilt binaries; its postinstall only checks them.
# Declared so `pnpm install` does not fail with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  esbuild: false
# Minutes a release must age before pnpm installs it (1 day).
minimumReleaseAge: 1440
# Exact "name@version" entries exempt from that age, for a version the repo must install before it ages out.
# Add a comment saying why. The weekly "Upstream check" workflow runs scripts/check-release-age.mts, which fails
# once an entry is older than minimumReleaseAge; delete it then and confirm `pnpm install --frozen-lockfile`.
minimumReleaseAgeExclude: []
